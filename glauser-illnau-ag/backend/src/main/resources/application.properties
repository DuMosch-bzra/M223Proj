# ===================================
# Glauser Illnau AG - Auftragsverwaltung
# ===================================

server.port=8080

# ===================================
# Supabase PostgreSQL Database
# ===================================
# TODO: Replace with your actual Supabase credentials
spring.datasource.url=jdbc:postgresql://db.<YOUR-PROJECT-REF>.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=<YOUR-PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' is safer than 'validate' - creates missing columns without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Prevent "no Session" errors for lazy-loaded relations
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ===================================
# Jackson - serialize LocalDateTime as ISO string
# ===================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Zurich

# ===================================
# JWT
# ===================================
app.jwt.secret=GlauserIllnauAGSecretKey2024MinLength32Chars!
app.jwt.expiration-ms=86400000

# ===================================
# CORS
# ===================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================================
# Logging
# ===================================
logging.level.ch.glauserillnau=DEBUG
logging.level.org.springframework.security=WARN
