# ===================================
# Glauser Illnau AG - Auftragsverwaltung
# ===================================

# Server
server.port=8080

# ===================================
# Supabase PostgreSQL Database
# ===================================
# Replace these values with your actual Supabase credentials
spring.datasource.url=jdbc:postgresql://db.<YOUR-SUPABASE-PROJECT-REF>.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=<YOUR-SUPABASE-DB-PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' in production since DB is already created via Supabase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT Configuration
# ===================================
# Generate a strong secret (min 256 bits / 32 chars)
app.jwt.secret=GlauserIllnauAGSecretKey2024!ChangeThisInProduction!
app.jwt.expiration-ms=86400000

# ===================================
# CORS (React Dev Server)
# ===================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================================
# Logging
# ===================================
logging.level.ch.glauserillnau=DEBUG
logging.level.org.springframework.security=INFO
